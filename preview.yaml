# What tools/preview.py shows (docs/PREVIEW.md of tessera-plugins): the keys of a monitor's sources, chosen and not.
tiles:
  - tile: keys
    name: A medium
    entity: input_select.monitor_source
    options: { script: script.show_source, field: quelle, picture: switch.monitor_picture, power: switch.monitor_power, labels: true, row_size: medium }
    sizes: [2x2]
  - tile: keys
    name: B large
    entity: input_select.monitor_source
    options: { script: script.show_source, field: quelle, picture: switch.monitor_picture, power: switch.monitor_power, labels: false, row_size: large }
    sizes: [2x2]
  - tile: keys
    name: C medium no words
    entity: input_select.monitor_source
    options: { script: script.show_source, field: quelle, picture: switch.monitor_picture, power: switch.monitor_power, labels: false, row_size: medium }
    sizes: [2x2]
  - tile: keys
    name: Source
    entity: input_select.monitor_source
    options: { script: script.show_source, field: quelle }
    sizes: [2x1, 2x2]
  - tile: keys
    name: Listed keys
    entity: input_select.monitor_source
    options: { keys: ["PC|windows", "Mac|apple", "PS5|playstation"], labels: false }
    sizes: [2x1]
  - tile: keys
    name: No select yet
    sizes: [2x1]

states:
  input_select.monitor_source:
    state: Mac
    attributes: { friendly_name: Monitor source, options: [PC, Mac, PS5, Switch 2] }
  script.show_source:
    state: "off"
    attributes: { friendly_name: Show source }
  switch.monitor_picture:
    state: "on"
    attributes: { friendly_name: Picture }
  switch.monitor_power:
    state: "on"
    attributes: { friendly_name: Power }
